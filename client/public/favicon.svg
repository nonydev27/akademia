<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="40" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="tassel" x1="0" y1="0" x2="6" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="shine" cx="25%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="40" height="40" rx="10" fill="url(#bg)" />
  <rect width="40" height="40" rx="10" fill="url(#shine)" />
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12" />

  <!-- Mortarboard top -->
  <polygon points="20,9 30,13.8 20,18.6 10,13.8" fill="url(#cap)" />
  <polygon points="20,9 30,13.8 20,18.6 10,13.8" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- Dome -->
  <path d="M13,15 L13,20.5 C13,23.3 16.1,25.6 20,25.6 C23.9,25.6 27,23.3 27,20.5 L27,15 L20,18.6 Z"
        fill="#ffffff" fill-opacity="0.9" />
  <path d="M13,15 L13,20.5 C13,23.3 16.1,25.6 20,25.6 C23.9,25.6 27,23.3 27,20.5 L27,15 L20,18.6 Z"
        fill="none" stroke="#c7d2fe" stroke-width="0.4" stroke-opacity="0.6" />

  <!-- Tassel string -->
  <line x1="30" y1="13.8" x2="30" y2="20" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85" />
  <circle cx="30" cy="21.2" r="1.8" fill="url(#tassel)" />
  <line x1="28.8" y1="23" x2="28.8" y2="27" stroke="#fcd34d" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="30"   y1="23" x2="30"   y2="27" stroke="#fcd34d" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="31.2" y1="23" x2="31.2" y2="27" stroke="#fcd34d" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Book spine -->
  <rect x="19.3" y="27.5" width="1.4" height="7" rx="0.6" fill="#ffffff" fill-opacity="0.85" />
  <!-- Left page -->
  <path d="M19.3,28 C16,27.5 13,28.5 12,29.5 L12,34.5 C13.2,33.5 16.2,32.8 19.3,33.3 Z" fill="#ffffff" fill-opacity="0.55" />
  <!-- Right page -->
  <path d="M20.7,28 C24,27.5 27,28.5 28,29.5 L28,34.5 C26.8,33.5 23.8,32.8 20.7,33.3 Z" fill="#ffffff" fill-opacity="0.55" />
  <!-- Page lines -->
  <line x1="13.5" y1="30.5" x2="18.5" y2="30.2" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="13.5" y1="31.8" x2="18.5" y2="31.5" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="13.5" y1="33.1" x2="18.5" y2="32.8" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="26.5" y1="30.5" x2="21.5" y2="30.2" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="26.5" y1="31.8" x2="21.5" y2="31.5" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="26.5" y1="33.1" x2="21.5" y2="32.8" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.5" stroke-linecap="round" />
</svg>
